name: Daily AI Investor Report

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 00:00 = 马来西亚早上8点
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
